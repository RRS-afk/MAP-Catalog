<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAP - Maju Abadi Perkasa</title>

    <!-- Meta untuk SEO dan sharing -->
    <meta name="description" content="Katalog produk Maju Abadi Perkasa (MAP) – Wall Panel, Decking, Cladding, PVC Foam Board, dan lainnya." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <!-- CSS eksternal -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <span class="logo-icon">MAP</span>
                <span class="logo-sub">Maju Abadi Perkasa</span>
            </div>
            <button class="btn-back" id="backHomeBtn">← Kembali</button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- Halaman Daftar Produk (Home) -->
        <section id="homeView">
            <h1 class="page-title">Koleksi Produk</h1>
            <p class="page-desc">Pilih salah satu produk untuk melihat detail lengkapnya.</p>
            <div class="product-grid" id="productGrid"></div>
        </section>

        <!-- Halaman Detail Produk (awalnya tersembunyi) -->
        <section id="detailView" class="detail-view hidden">
            <!-- Isi akan di-generate oleh JavaScript -->
            <div id="detailContainer"></div>
        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Maju Abadi Perkasa. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
